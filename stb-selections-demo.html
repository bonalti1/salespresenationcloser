<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>South Texas Builders — Client Selections Demo</title>
<!--
  ============================================================================
  SOUTH TEXAS BUILDERS — CLIENT SELECTIONS DEMO (presentation only)
  ----------------------------------------------------------------------------
  Self-contained, single-file demo of how a client chooses their home
  selections. No backend, no login, nothing is saved — it's purely a visual
  walkthrough for the sales presentation "Selections" tab.

  HOW TO USE / EMBED:
    - Open this file directly in any browser, OR
    - Embed in a slide/site with:  <iframe src="stb-selections-demo.html"
      style="width:100%;height:720px;border:0"></iframe>

  Images load from the live app (needs internet). To make it fully offline,
  download the /images/selections/ files and repoint IMG_BASE below.
  ============================================================================
-->
<style>
  :root{
    --navy:#1B2A4A; --red:#C0392B; --bg:#eef1f6; --card:#ffffff;
    --line:rgba(27,42,74,.12); --muted:#7a8498;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:#1a1a1a}
  .app{max-width:760px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

  /* Header */
  .top{background:var(--navy);color:#fff;padding:14px 18px;border-bottom:3px solid var(--red);position:sticky;top:0;z-index:5}
  .brand{display:flex;align-items:center;gap:12px}
  .brand img{width:40px;height:40px;border-radius:9px;background:#fff;object-fit:contain}
  .brand small{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#aeb8c6}
  .brand strong{display:block;font-size:16px;line-height:1.1}
  .demoTag{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.08em;background:var(--red);padding:4px 9px;border-radius:999px}
  .progressWrap{margin-top:12px}
  .progressMeta{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:#cdd4df;margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
  .track{height:6px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden}
  .bar{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--red),#d0a437);transition:width .35s ease}

  /* Body */
  .body{flex:1;padding:20px 18px 110px}
  .stepTitle{color:var(--navy);font-size:22px;font-weight:800;margin-bottom:2px}
  .stepSub{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:16px}
  .groupNote{color:var(--navy);font-weight:800;font-size:14px;margin:18px 0 10px}
  .groupNote:first-of-type{margin-top:0}

  .grid{display:grid;gap:12px}
  .card{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s;text-align:center}
  .card:hover{transform:translateY(-2px);border-color:rgba(192,57,43,.4)}
  .card.sel{border-color:var(--red);background:var(--navy);color:#fff;box-shadow:0 10px 22px rgba(192,57,43,.22)}
  .card img{width:100%;height:120px;object-fit:cover;border-radius:8px;margin-bottom:8px;background:#f4f6fa}
  .card.contain img{object-fit:contain;background:#fff}
  .card .name{font-size:13px;font-weight:700}
  .card .sub{font-size:11px;color:var(--muted);margin-top:2px}
  .card.sel .sub{color:#cdd4df}
  .swatch{height:64px;border-radius:8px;margin-bottom:8px}

  /* Finish */
  .finish{text-align:center;padding:40px 20px}
  .finish .check{width:84px;height:84px;border-radius:50%;background:#ecfdf3;color:#166534;display:flex;align-items:center;justify-content:center;font-size:44px;margin:0 auto 18px}
  .finish h2{color:var(--navy);font-size:26px;margin-bottom:8px}
  .finish p{color:var(--muted);max-width:420px;margin:0 auto 22px;line-height:1.5}
  .summary{max-width:460px;margin:0 auto;text-align:left}
  .sumRow{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line)}
  .sumRow span{color:var(--muted);font-size:13px;font-weight:700}
  .sumRow strong{color:var(--navy);font-size:14px;text-align:right}

  /* Footer nav */
  .nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:14px 18px;display:flex;gap:12px;max-width:760px;margin:0 auto}
  .btn{flex:1;min-height:50px;border:0;border-radius:11px;font-size:15px;font-weight:800;cursor:pointer}
  .btn.back{flex:0 0 110px;background:#eef1f6;color:var(--navy)}
  .btn.next{background:linear-gradient(135deg,var(--navy),#263a63);color:#fff;border-bottom:3px solid var(--red)}
  .btn:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">
      <img src="/images/brand/stb-logo.png" alt="STB"/>
      <div>
        <small>South Texas Builders</small>
        <strong>Client Selections</strong>
      </div>
      <span class="demoTag">DEMO</span>
    </div>
    <div class="progressWrap">
      <div class="progressMeta"><span id="stepName">Getting started</span><span id="stepCount">0 / 5</span></div>
      <div class="track"><div class="bar" id="bar" style="width:0%"></div></div>
    </div>
  </div>

  <div class="body" id="body"></div>

  <div class="nav">
    <button class="btn back" id="back" onclick="prev()">Back</button>
    <button class="btn next" id="next" onclick="nextStep()">Save &amp; Continue</button>
  </div>
</div>

<script>
const IMG_BASE = '/images/selections/';

// Each step has one or more groups (a group = a labeled set of choices).
const STEPS = [
  { title:'Shingle Color', sub:'Roof shingle', groups:[
    { note:'Select your shingle color:', key:'shingle', cols:3, options:[
      {name:'Brownwood', img:'shingle-brownwood.jpg'},
      {name:'Estate Gray', img:'shingle-estate-gray.jpg'},
      {name:'Driftwood', img:'shingle-driftwood.jpg'},
      {name:'Teak', img:'shingle-teak.jpg'},
      {name:'Desert Tan', img:'shingle-desert-tan.jpg'},
      {name:'Onyx Black', img:'shingle-onyx-black.jpg'},
    ]}
  ]},
  { title:'Ceiling Design', sub:'Living room ceiling', groups:[
    { note:'Select the ceiling design:', key:'ceiling', cols:2, contain:true, options:[
      {name:'Tray Ceiling', img:'ceiling-tray-lighted.png'},
      {name:'Recessed Tray', img:'ceiling-recessed-lighted.png'},
      {name:'Double Tray', img:'ceiling-double-tray-lighted.png'},
      {name:'Wood Slat', img:'ceiling-wood-slat.png'},
      {name:'Vaulted', img:'ceiling-vaulted-shiplap.png'},
      {name:'Vaulted w/ Beams', img:'ceiling-vaulted-beams.png'},
    ]}
  ]},
  { title:'Front Door', sub:'Configure your entry door', groups:[
    { note:'1. Bore Type', key:'bore', cols:2, contain:true, options:[
      {name:'Single Bore', sub:'Knob/lever only', img:'front-door-bore-single.jpg'},
      {name:'Double Bore', sub:'Knob + deadbolt', img:'front-door-bore-double.jpg'},
    ]},
    { note:'2. Glass Type', key:'glass', cols:2, options:[
      {name:'Reflective Silver', img:'front-door-glass-reflective.jpg'},
      {name:'Light Smoke', img:'front-door-glass-smoke.jpg'},
      {name:'Clear', img:'front-door-glass-clear.jpg'},
      {name:'Frosted White', img:'front-door-glass-frosted.jpg'},
    ]},
    { note:'3. Hinges — Color & Threshold', key:'hinge', cols:2, contain:true, options:[
      {name:'Nickel / Satin Silver', img:'front-door-hinge-nickel.jpg'},
      {name:'Black / Matte Black', img:'front-door-hinge-black.jpg'},
    ]},
  ]},
  { title:'Kitchen Sink', sub:'Standard options', groups:[
    { note:'Choose your kitchen sink:', key:'sink', cols:2, contain:true, options:[
      {name:'Fireclay Glossy', sub:'33×20, 10" deep', img:'kitchen-sink-1.jpg'},
      {name:'Fireclay Crisp White', sub:'33×18', img:'kitchen-sink-2.jpg'},
      {name:'Fireclay Double Bowl', sub:'33×18', img:'kitchen-sink-3.jpg'},
      {name:'Quartz Composite', sub:'33×22', img:'kitchen-sink-4.jpg'},
      {name:'Stainless 16ga', sub:'33×22', img:'kitchen-sink-5.jpg'},
    ]}
  ]},
  { title:'Garage Door', sub:'Garage door style', groups:[
    { note:'Choose your garage door style:', key:'garage', cols:2, options:[
      {name:'Long Panel', img:'garage-door-long-panel.jpg'},
      {name:'Short Panel', img:'garage-door-short-panel.jpg'},
    ]}
  ]},
];

const SUMMARY_LABELS = {shingle:'Shingle Color',ceiling:'Ceiling Design',bore:'Door Bore',glass:'Door Glass',hinge:'Door Hinges',sink:'Kitchen Sink',garage:'Garage Door'};

let step = 0;
const picks = {};
const TOTAL = STEPS.length;

function render(){
  const body = document.getElementById('body');
  const bar = document.getElementById('bar');
  const isFinish = step >= TOTAL;

  bar.style.width = (isFinish ? 100 : Math.round((step/TOTAL)*100)) + '%';
  document.getElementById('stepCount').textContent = isFinish ? 'Complete' : ((step+1) + ' / ' + TOTAL);
  document.getElementById('stepName').textContent = isFinish ? 'All done' : STEPS[step].title;
  document.getElementById('back').disabled = step === 0;
  document.getElementById('next').textContent = isFinish ? 'Restart Demo' : (step === TOTAL-1 ? 'Submit Selections' : 'Save & Continue');

  if(isFinish){ body.innerHTML = finishHTML(); window.scrollTo(0,0); return; }

  const s = STEPS[step];
  let html = '<div class="stepTitle">'+s.title+'</div><div class="stepSub">'+s.sub+'</div>';
  s.groups.forEach(g=>{
    html += '<div class="groupNote">'+g.note+'</div>';
    html += '<div class="grid" style="grid-template-columns:repeat('+g.cols+',1fr)">';
    g.options.forEach((o,i)=>{
      const sel = picks[g.key]===o.name ? ' sel' : '';
      const cc = g.contain ? ' contain' : '';
      const media = o.img ? '<img src="'+IMG_BASE+o.img+'" alt="'+o.name+'" onerror="this.style.visibility=\'hidden\'"/>'
                          : '<div class="swatch" style="background:'+(o.color||'#ddd')+'"></div>';
      html += '<div class="card'+cc+sel+'" onclick="pick(\''+g.key+'\',\''+o.name.replace(/'/g,"\\'")+'\')">'
            + media + '<div class="name">'+o.name+'</div>'
            + (o.sub?'<div class="sub">'+o.sub+'</div>':'') + '</div>';
    });
    html += '</div>';
  });
  body.innerHTML = html;
  window.scrollTo(0,0);
}

function pick(key,name){ picks[key]=name; render(); }
function nextStep(){ if(step>=TOTAL){ step=0; for(const k in picks) delete picks[k]; render(); return; } step++; render(); }
function prev(){ if(step>0){ step--; render(); } }

function finishHTML(){
  let rows='';
  Object.keys(SUMMARY_LABELS).forEach(k=>{
    if(picks[k]) rows += '<div class="sumRow"><span>'+SUMMARY_LABELS[k]+'</span><strong>'+picks[k]+'</strong></div>';
  });
  if(!rows) rows = '<div class="sumRow"><span>No selections chosen</span><strong>—</strong></div>';
  return '<div class="finish"><div class="check">✓</div>'
    + '<h2>Selections Submitted</h2>'
    + '<p>Thank you! Your South Texas Builders team will review your selections and confirm final products, pricing, and availability.</p>'
    + '<div class="summary">'+rows+'</div></div>';
}

render();
</script>
</body>
</html>
